<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ---------------- storage ----------------
   The browser copy is the fast one and works offline. When sync is set up,
   the file on GitHub is the real one: pulled on open, pushed after changes. */
const KEY='cards:v1';
const CFG='cards:sync';
let mem=null,syncT=null,syncing=false;

function cfg(){
  try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch(e){return{}}
}
function setCfg(o){
  try{localStorage.setItem(CFG,JSON.stringify(o))}catch(e){}
}
async function loadLocal(){
  try{const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value);}catch(e){}
  try{const t=localStorage.getItem(KEY);if(t)return JSON.parse(t);}catch(e){}
  return mem;
}
async function saveLocal(){
  mem=S;
  const t=JSON.stringify(S);
  try{await window.storage.set(KEY,t);}catch(e){}
  try{localStorage.setItem(KEY,t);}catch(e){}
}
async function save(){
  S.updated=new Date().toISOString();
  await saveLocal();
  queueSync();
}

/* ---- GitHub ---- */
const ghOn=()=>{const c=cfg();return !!(c.token&&c.repo)};
function ghUrl(){
  const c=cfg();
  return 'https://api.github.com/repos/'+c.repo+'/contents/'+(c.path||'data.json');
}
async function ghGet(){
  const c=cfg();
  const r=await fetch(ghUrl(),{headers:{Authorization:'Bearer '+c.token,
    Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)return{missing:true};
  if(!r.ok)throw new Error(r.status===401||r.status===403?'key':'http '+r.status);
  const j=await r.json();
  const txt=decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))));
  return{sha:j.sha,data:JSON.parse(txt)};
}
async function ghPut(obj,sha){
  const c=cfg();
  const body={message:'cards '+new Date().toISOString(),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(obj)))) };
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:{Authorization:'Bearer '+c.token,
    Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status===409?'conflict':(r.status===401||r.status===403?'key':'http '+r.status));
  const j=await r.json();
  return j.content&&j.content.sha;
}
function queueSync(){
  if(!ghOn())return;
  clearTimeout(syncT);
  syncT=setTimeout(()=>pushUp().catch(()=>{}),1500);
}
async function pushUp(){
  if(!ghOn()||syncing)return;
  syncing=true;
  const c=cfg();
  try{
    const sha=await ghPut(S,c.sha);
    setCfg({...c,sha,last:new Date().toISOString(),err:null});
  }catch(e){
    if(String(e.message)==='conflict'){
      // someone else wrote first — take their sha and try once more
      try{const r=await ghGet();const sha=await ghPut(S,r.sha);
        setCfg({...cfg(),sha,last:new Date().toISOString(),err:null});}
      catch(e2){setCfg({...cfg(),err:String(e2.message)});}
    }else setCfg({...cfg(),err:String(e.message)});
  }
  syncing=false;
  if(V.view==='sync')draw();
}
const weight=d=>((d&&d.txns||[]).length)+((d&&d.cycles||[]).length);
/* returns 'pulled' | 'same' | 'pushed' | 'blocked' | 'error' */
async function pullDown(){
  if(!ghOn())return 'off';
  try{
    const r=await ghGet();
    if(r.missing){await pushUp();return 'pushed';}
    const mine=S&&S.updated?new Date(S.updated).getTime():0;
    const theirs=r.data&&r.data.updated?new Date(r.data.updated).getTime():0;
    setCfg({...cfg(),sha:r.sha,last:new Date().toISOString(),err:null});
    const hereW=weight(S),thereW=weight(r.data);
    // an empty device must never wipe a copy that has data in it, whatever
    // the clocks say — and the reverse is a free win, so take it
    if(hereW===0&&thereW>0){S=r.data;await saveLocal();return 'pulled';}
    if(thereW===0&&hereW>0){await pushUp();return 'pushed';}
    if(theirs>mine){S=r.data;await saveLocal();return 'pulled';}
    if(mine>theirs){await pushUp();return 'pushed';}
    return 'same';
  }catch(e){setCfg({...cfg(),err:String(e.message)});return 'error';}
}

const BUILD='v11 · 4 Aug';
/* ---------------- cards ---------------- */
const CARDS=[
 {id:'tmrw', name:'TMRW',           cut:7,  due:31, split:0, c:'#7F77DD', t:'#EEEDFE', d:'#3C3489'},
 {id:'ttb',  name:'TTB',            cut:17, due:6,  split:3, c:'#378ADD', t:'#E6F1FB', d:'#0C447C'},
 {id:'ktcb', name:'KTC บางจาก',      cut:17, due:1,  split:0, c:'#BA7517', t:'#FAEEDA', d:'#633806'},
 {id:'ktcc', name:'KTC cash back',  cut:17, due:1,  split:0, c:'#D85A30', t:'#FAECE7', d:'#712B13'},
 {id:'cxup', name:'CardX UP2ME',    cut:23, due:12, split:4, c:'#1D9E75', t:'#E1F5EE', d:'#085041'},
 {id:'cxjcb',name:'CardX JCB',      cut:23, due:12, split:4, c:'#D4537E', t:'#FBEAF0', d:'#72243E'}
];
const card=id=>S.cards.find(c=>c.id===id)||CARDS.find(c=>c.id===id);
const visibleCards=()=>S.cards.filter(c=>!c.hidden);
function dark(){return matchMedia('(prefers-color-scheme:dark)').matches}
/* any colour the person picks has to stay readable in both modes, so the
   background tint and the text shade are derived from it rather than stored */
function rgbOf(h){h=String(h||'#888888').replace('#','');
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0);}
function mixTo(rgb,to,t){return rgb.map((v,i)=>Math.round(v+(to[i]-v)*t))}
function toHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
function tint(c){return dark()?(c.c+'26'):toHex(mixTo(rgbOf(c.c),[255,255,255],0.88))}
function ontint(c){return dark()?toHex(mixTo(rgbOf(c.c),[255,255,255],0.35))
                               :toHex(mixTo(rgbOf(c.c),[0,0,0],0.55))}

/* ---------------- dates ---------------- */
const D=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+D(d.getMonth()+1)+'-'+D(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
function clampDay(y,m,day){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))}
function closingFor(c,dateStr){
  const d=parse(dateStr);let t=clampDay(d.getFullYear(),d.getMonth(),c.cut);
  if(t<d)t=clampDay(d.getFullYear(),d.getMonth()+1,c.cut);
  return t;
}
function dueFor(c,closing){
  let t=clampDay(closing.getFullYear(),closing.getMonth(),c.due);
  if(t<=closing)t=clampDay(closing.getFullYear(),closing.getMonth()+1,c.due);
  return t;
}
const cycKey=(c,dateStr)=>c.id+'|'+iso(closingFor(c,dateStr));
/* how many of this card's cut-offs have gone by since a purchase */
function cyclesSince(c,startDate){
  let n=0,d=closingFor(c,startDate),guard=0;
  while(parse(iso(d))<parse(today())&&guard++<120){
    n++;d=clampDay(d.getFullYear(),d.getMonth()+1,c.cut);
  }
  return n;
}
function daysTo(dstr){return Math.round((parse(dstr)-parse(today()))/864e5)}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDate=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};

/* ---------------- money ---------------- */
const B=n=>'฿'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:(Number(n)%1?2:0),maximumFractionDigits:2});
/* the keypad keeps the amount as typed so a trailing dot survives redraws */
function fmtAmt(str){
  if(!str)return '0';
  const i=str.split('.')[0],d=str.split('.')[1];
  const ip=Number(i||0).toLocaleString('en-US');
  return d===undefined?ip:ip+'.'+d;
}
const B2=n=>'฿'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const up=(n,step)=>Math.ceil(n/step)*step;
/* small spends round to 10, thousands to 100, ten-thousands to 1,000 */
const autoStep=n=>n>=10000?1000:n>=1000?100:10;
const RMODES=[null,10,100,0];
function reserveFor(amt,mode){
  if(!amt)return 0;
  const m=RMODES[mode||0];
  if(m===0)return amt;
  return up(amt,m||autoStep(amt));
}
function modeLabel(amt,mode){
  const m=RMODES[mode||0];
  if(m===0)return 'exact';
  return 'nearest '+(m||autoStep(amt)).toLocaleString();
}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------------- state ---------------- */
let S=null,V={view:'home'},toastT=null;
function fresh(){
  return{v:1,setup:false,jarOpen:0,pwDate:'',pw:{},log:[],quick:['7-Eleven','Shopee Food'],
         jars:defaultJars(),cashback:[],
         cards:CARDS.map(c=>({...c})),txns:[],plans:[],cycles:[],moves:[]};
}

/* ---------------- undo ----------------
   Anything that changes several things at once takes a snapshot first, so
   undo restores rather than trying to reverse each step by hand.         */
function snapshot(){
  return JSON.stringify({txns:S.txns,plans:S.plans,cycles:S.cycles,moves:S.moves,
                         jarOpen:S.jarOpen,cards:S.cards});
}
function logAct(o){
  S.log=S.log||[];
  S.log.unshift({id:uid(),t:new Date().toISOString(),...o});
  const cut=Date.now()-7*864e5;
  S.log=S.log.filter(x=>new Date(x.t).getTime()>=cut).slice(0,80);
  S.log.forEach((x,i)=>{if(i>=8)delete x.snap;});   // keep storage sane
}
function undoTo(id){
  const i=S.log.findIndex(x=>x.id===id);
  if(i<0||!S.log[i].snap)return false;
  const d=JSON.parse(S.log[i].snap);
  S.txns=d.txns;S.plans=d.plans;S.cycles=d.cycles;S.moves=d.moves;
  S.jarOpen=d.jarOpen;if(d.cards)S.cards=d.cards;
  S.log=S.log.slice(i+1);
  return true;
}
function logTime(t){
  const d=new Date(t),n=new Date();
  const day=d.toDateString()===n.toDateString()?'today'
    :d.toDateString()===new Date(n-864e5).toDateString()?'yesterday'
    :d.getDate()+' '+MON[d.getMonth()];
  return day+', '+D(d.getHours())+':'+D(d.getMinutes());
}

/* ---------------- accounts ----------------
   One per spare bank account. Cards paid from the same account share one, and
   every figure the app tracks is worked out per account rather than overall. */
function defaultJars(){
  return[
   {id:'j_tmrw', name:'TMRW account', cards:['tmrw'],         open:0},
   {id:'j_cardx',name:'CardX account',cards:['cxup','cxjcb'], open:0},
   {id:'j_ttb',  name:'TTB account',  cards:['ttb'],          open:0},
   {id:'j_ktc',  name:'KTC account',  cards:['ktcb','ktcc'],  open:0}
  ];
}
const jars=()=>S.jars||(S.jars=defaultJars());
const jarOfCard=id=>jars().find(j=>(j.cards||[]).includes(id))||jars()[0];
function jarBal(j){
  return (j.open||0)+S.moves.filter(m=>m.jar===j.id)
    .reduce((s,m)=>s+(m.kind==='in'?m.amt:-m.amt),0);
}
function jarOwed(j){
  return S.cycles.filter(c=>c.status==='billed'&&(j.cards||[]).includes(c.cardId))
    .reduce((s,c)=>s+(c.total||0),0);
}
function jarTodo(j){
  const t=notMoved().filter(x=>(j.cards||[]).includes(x.cardId));
  const p=planTodo().filter(x=>(j.cards||[]).includes(x.cardId));
  return{txns:t,plans:p,
    amt:t.reduce((s,x)=>s+x.reserved,0)+p.reduce((s,x)=>s+up(x.monthly,autoStep(x.monthly)),0)};
}
function jarComing(j){
  const open=S.txns.filter(t=>{const cy=cycleOf(t);
    return (j.cards||[]).includes(t.cardId)&&(!cy||cy.status==='open')})
    .reduce((s,t)=>s+t.reserved,0);
  const inst=activePlans().filter(p=>(j.cards||[]).includes(p.cardId)
    &&cycKey(card(p.cardId),p.start)!==cycKey(card(p.cardId),today()))
    .reduce((s,p)=>s+p.monthly,0);
  return jarOwed(j)+open+inst;
}

/* ---------------- cash back ----------------
   Every card that pays it prints it on the statement, so this is normally
   automatic. The bank has already deducted it from the bill, so it is only
   ever recorded — it never moves money.                                    */
function cbFor(id){return (S.cashback||[]).filter(x=>x.cardId===id)}
function cbLatest(id){return cbFor(id).sort((a,b)=>a.closing<b.closing?1:-1)[0]}
function cbYear(id){
  const y=new Date().getFullYear();
  const rows=cbFor(id).filter(x=>parse(x.closing).getFullYear()===y);
  const stated=rows.map(x=>x.year).filter(v=>v!=null);
  return stated.length?Math.max(...stated):rows.reduce((s,x)=>s+x.cycle,0);
}
function cbAll(id){return cbFor(id).reduce((s,x)=>s+x.cycle,0)}
function setCashback(cardId,closing,cycle,year){
  S.cashback=S.cashback||[];
  const i=S.cashback.findIndex(x=>x.cardId===cardId&&x.closing===closing);
  const row={cardId,closing,cycle};
  if(year!=null)row.year=year;
  if(i>=0)S.cashback[i]=row;else S.cashback.push(row);
}

/* derived */
const openTxns=()=>S.txns.filter(t=>!cycleOf(t)||cycleOf(t).status==='open');
function cycleOf(t){return S.cycles.find(c=>c.key===t.cyc)}
function ensureCycle(key){
  let c=S.cycles.find(x=>x.key===key);
  if(!c){const[cid,close]=key.split('|');const cd=card(cid);
    c={key,cardId:cid,closing:close,due:iso(dueFor(cd,parse(close))),status:'open',total:null};
    S.cycles.push(c);}
  return c;
}
function unpaidBills(){
  return S.cycles.filter(c=>c.status==='billed').reduce((s,c)=>s+(c.total||0),0);
}
function openReserved(){
  return S.txns.filter(t=>{const c=cycleOf(t);return !c||c.status==='open'})
               .reduce((s,t)=>s+(t.reserved||0),0);
}
function activePlans(){return S.plans.filter(p=>p.paid<p.months)}
/* what this card will bill when the cycle closes: what you logged plus the
   แบ่ง slices the bank will add on its own */
function cardCycle(cardId){
  const c=card(cardId);
  const txns=S.txns.filter(t=>{const cy=cycleOf(t);return t.cardId===cardId&&(!cy||cy.status==='open')});
  const spent=txns.reduce((s,t)=>s+t.reserved,0);
  const plans=activePlans().filter(p=>p.cardId===cardId&&cycKey(c,p.start)!==cycKey(c,today()));
  const inst=plans.reduce((s,p)=>s+p.monthly,0);
  return{txns,spent,plans,inst,total:spent+inst};
}
function planTodo(){
  return activePlans().filter(p=>{
    const c=card(p.cardId),k=cycKey(c,today());
    if(cycKey(c,p.start)===k)return false;   // first payment logged with the purchase
    return p.lastMoved!==k;
  });
}
function planDue(){return activePlans().reduce((s,p)=>s+up(p.monthly,autoStep(p.monthly)),0)}
function notMoved(){return S.txns.filter(t=>!t.moved)}

/* a purchase sitting in a cycle that hasn't been billed yet can't have a real
   statement amount — earlier builds could set one by mistake, so clear it */
function repairOpen(){
  let n=0;
  S.txns.forEach(t=>{
    const cy=cycleOf(t);
    if(t.actual!=null&&(!cy||cy.status==='open')){t.actual=null;n++;}
  });
  return n;
}

/* ---------------- render ---------------- */
const app=()=>document.getElementById('app');
function go(v,d){V={view:v,...(d||{})};draw();window.scrollTo(0,0)}
function toast(m){
  const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);
  clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2200);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function draw(){
  const v=V.view;
  let h='';
  if(!S.setup&&v!=='setup')return go('setup');
  if(V.confirm)h=vConfirm();
  else if(v==='setup')h=vSetup();

/* ---------- home ---------- */
function vHome(){
  const bills=S.cycles.filter(c=>c.status==='billed').sort((a,b)=>a.due<b.due?-1:1);
  const n=new Date();
  let h=`<div class="lbl">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n.getDay()]}, ${n.getDate()} ${MON[n.getMonth()]}</div>`;
  h+='<div class="card" style="padding:4px 16px;margin-top:12px">';
  const vis=visibleCards();
  vis.forEach((c,i)=>{
    const cc=cardCycle(c.id);
    const close=iso(closingFor(c,today()));
    const bill=bills.find(b=>b.cardId===c.id);
    const bits=[];
    if(cc.txns.length)bits.push(cc.txns.length+' item'+(cc.txns.length>1?'s':''));
    if(cc.plans.length)bits.push(cc.plans.length+' แบ่ง');
    h+=`<div style="padding:12px 0${i?';border-top:1px solid var(--line)':''}" data-card="${c.id}">
      <div class="row"><span class="nm" style="color:${c.c}">${esc(c.name)}</span>
        <span class="nm">${cc.total?B(cc.total):'—'}</span></div>
      ${cc.inst?`<div style="font-size:12px;color:var(--tx2);margin-top:3px">${B(cc.spent)} spent &nbsp;+&nbsp; ${B(cc.inst)} แบ่ง</div>`:''}
      <div class="row" style="margin-top:2px"><span class="mut">ตัด ${c.cut} · closes ${shortDate(close)}</span>
        <span class="mut">${bits.length?bits.join(' · '):'nothing yet'}</span></div>
      ${bill?`<div style="margin-top:7px"><span class="chip" style="background:${dark()?'#BA751733':'#FAEEDA'};color:${dark()?'#EF9F27':'#633806'}">${B2(bill.total)} to pay · ${shortDate(bill.due)}</span></div>`:''}
    </div>`;
  });
  h+='</div>';
  h+=`<button class="btn" data-go="add" style="padding:19px">+&nbsp; Add a purchase</button>`;

  jars().forEach(j=>{
    const td=jarTodo(j);
    if(!td.amt)return;
    h+=`<div class="strip" style="background:${dark()?'#BA751726':'#FAEEDA'};color:${dark()?'#EF9F27':'#633806'}"
      data-movejar="${j.id}"><span>Move ${B(td.amt)} to ${esc(j.name)}</span><span>→</span></div>`;
  });
  bills.forEach(b=>{
    const c=card(b.cardId),d=daysTo(b.due);
    h+=`<div class="strip" style="background:${tint(c)};color:${ontint(c)}" data-pay="${b.key}">
      <span>Pay ${esc(c.name)} ${B2(b.total)} · ${d<0?(-d)+' days late':d===0?'today':d+' day'+(d>1?'s':'')}</span><span>→</span></div>`;
  });
  return h+nav('home');
}

function agoText(iso){
  if(!iso)return 'never';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return 'just now';
  if(m<60)return m+' minute'+(m>1?'s':'')+' ago';
  const h=Math.round(m/60);
  if(h<24)return h+' hour'+(h>1?'s':'')+' ago';
  return Math.round(h/24)+' day'+(h>24?'s':'')+' ago';
}

  if(s.includes('jcb'))return 'cxjcb';
  if(s.includes('up2me'))return 'cxup';
  if(s.includes('ttb'))return 'ttb';
  if(s.includes('cash back')||s.includes('cashback'))return 'ktcc';
  if(head.includes('บางจาก')||s.includes('bangchak'))return 'ktcb';
  if(s.includes('ktc'))return 'ktcb';
  if(s.includes('cardx'))return 'cxup';
  return null;
}
function parseNotes(text){
  const out=[];let cur=null;
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/[\u200b\u00ad]/g,'').trim();
    if(!line)return;
    const entry=line.match(/^[-–—•*\s]*(\d{6})\s*[:：]\s*(.+)$/);
    if(entry&&cur){
      const y=+entry[1].slice(0,2),m=+entry[1].slice(2,4),d=+entry[1].slice(4,6);
      if(m<1||m>12||d<1||d>31)return;
      let rest=entry[2].trim();
      let tag=null;
      const tm=rest.match(/(แบ่งแล้ว|ไม่แบ่ง|ยัง)/);
      if(tm){tag=tm[1];rest=rest.replace(/[\(（]?\s*(แบ่งแล้ว|ไม่แบ่ง|ยัง)\s*[\)）]?/g,'').trim();}
      let amt=null;
      if(rest.includes('=')){const a=rest.split('=').pop().match(/[\d,]+(?:\.\d+)?/);if(a)amt=+a[0].replace(/,/g,'');}
      if(amt==null){const all=rest.match(/[\d,]+(?:\.\d+)?/g);if(all)amt=+all[all.length-1].replace(/,/g,'');}
      if(!amt)return;
      let desc=rest.replace(/[\d,]+(?:\.\d+)?\s*$/,'').replace(/\s*[\d,+=.]+\s*$/,'').trim();
      out.push({cardId:cur,date:(2000+y)+'-'+D(m)+'-'+D(d),note:desc||'—',amt,tag});
      return;
    }
    const cid=matchCard(line);
    if(cid&&!/^\s*[-–—•*]/.test(raw)&&line.length<60)cur=cid;
  });
  return out;
}
function applyNotes(rows){
  let added=0,plans=0,dupes=0;
  rows.forEach(r=>{
    const dup=S.txns.some(t=>t.cardId===r.cardId&&t.date===r.date&&t.reserved===r.amt&&(t.note||'')===(r.note||''));
    if(dup){dupes++;return;}
    const c=card(r.cardId);
    const key=cycKey(c,r.date);ensureCycle(key);
    if(r.tag==='แบ่งแล้ว'&&c.split){
      S.plans.push({id:uid(),cardId:c.id,title:r.note,total:r.amt,months:c.split,
        monthly:+(r.amt/c.split).toFixed(2),start:r.date,
        paid:Math.min(c.split,cyclesSince(c,r.date)),est:true});
      plans++;
    }
    S.txns.push({id:uid(),cardId:r.cardId,date:r.date,note:r.note,actual:null,
      reserved:r.amt,moved:true,cyc:key,tag:r.tag||null});
    added++;
  });
  // anything already past its due date is history
  S.cycles.forEach(cy=>{
    if(cy.status==='open'&&parse(cy.due)<parse(today())){
      cy.status='paid';cy.paidOn=cy.due;
      cy.total=cy.total||S.txns.filter(t=>t.cyc===cy.key).reduce((s,t)=>s+t.reserved,0);
    }
  });
  return{added,plans,dupes};
}

/* ---------------- statement parsing ---------------- */
function detectBank(t){
  if(/ttbbank|TMBThanachart|ทหารไทยธนชาต/i.test(t))return 'ttb';
  if(/CardX|Card X Co/i.test(t))return 'cardx';
  if(/KRUNGTHAI CARD|ktc\.co\.th|เคทีซี/i.test(t))return 'ktc';
  if(/UOB|TMRW CREDIT CARD/i.test(t))return 'uob';
  return null;
}
const num=s=>+String(s).replace(/,/g,'');
function normDash(s){return s.replace(/[\u00ad\u2010\u2011\u2012\u2013\u2014\u2212]/g,'-')}
function parseStatement(text){
  text=normDash(text);
  const bank=detectBank(text);
  const lines=[];const seen=new Set();
  const push=(date,desc,amt)=>{
    desc=desc.replace(/\s+/g,' ').trim();
    desc=desc.replace(/\s+[\d,]+\.\d{2}$/,'').replace(/\s+-$/,'').trim();
    if(!desc||!isFinite(amt)||amt===0)return;
    const sig=date+'|'+desc+'|'+amt;
    if(seen.has(sig))return;seen.add(sig);
    let seq=null,of=null;
    const m=desc.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
    if(m){seq=+m[1];of=+m[2];desc=desc.replace(m[0],'').trim();}
    const bankline=/CASH ?BACK|REBATE|PAYMENT|ชำระ|เงินฝาก|THANK YOU|BALANCE|TOTAL/i.test(desc)||amt<0;
    lines.push({date,desc,amt,seq,of,bank:bankline});
  };
  const yr=new Date().getFullYear();
  text.split(/\r?\n/).forEach(raw=>{
    const L=raw.replace(/\s+/g,' ').trim();
    if(!L)return;
    let m;
    const sg=(s,a)=>(s?-1:1)*num(a);
    // dd/mm/yyyy dd/mm/yyyy desc amount
    if(m=L.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+\d{2}\/\d{2}\/\d{4}\s+(.+?)\s+(-\s*)?([\d,]+\.\d{2})$/))
      return push(m[3]+'-'+m[2]+'-'+m[1],m[4],sg(m[5],m[6]));
    // dd/mm/yy dd/mm/yy desc amount
    if(m=L.match(/^(\d{2})\/(\d{2})\/(\d{2})\s+\d{2}\/\d{2}\/\d{2}\s+(.+?)\s+(-\s*)?([\d,]+\.\d{2})$/))
      return push('20'+m[3]+'-'+m[2]+'-'+m[1],m[4],sg(m[5],m[6]));
    // dd/mm dd/mm desc amount
    if(m=L.match(/^(\d{2})\/(\d{2})\s+\d{2}\/\d{2}\s+(.+?)\s+(-\s*)?([\d,]+\.\d{2})$/))
      return push(yr+'-'+m[2]+'-'+m[1],m[3],sg(m[4],m[5]));
    // dd MMM dd MMM desc amount [CR]
    if(m=L.match(/^(\d{2})\s+([A-Z]{3})\s+\d{2}\s+[A-Z]{3}\s+(.+?)\s+([\d,]+\.\d{2})(\s*CR)?$/i)){
      const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
      if(mi>=0)return push(yr+'-'+D(mi+1)+'-'+m[1],m[3],(m[5]?-1:1)*num(m[4]));
    }
  });
  if(lines.length<3){
    // line-by-line failed; scan the whole document as one blob
    const blob=text.replace(/\s+/g,' ');
    let m;
    const r1=/(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+\d{2}\/\d{2}(?:\/\d{2,4})?\s+(.{2,70}?)\s+(-\s*)?([\d,]+\.\d{2})(?=\s|$)/g;
    while(m=r1.exec(blob)){
      let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):yr;
      push(y+'-'+m[2]+'-'+m[1],m[4],(m[5]?-1:1)*num(m[6]));
    }
    const r2=/(\d{2})\s+([A-Z]{3})\s+\d{2}\s+[A-Z]{3}\s+(.{2,70}?)\s+([\d,]+\.\d{2})(\s*CR)?(?=\s|$)/gi;
    while(m=r2.exec(blob)){
      const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
      if(mi>=0)push(yr+'-'+D(mi+1)+'-'+m[1],m[3],(m[5]?-1:1)*num(m[4]));
    }
  }
  let total=null;
  const pats=[/GRAND TOTAL\s+([\d,]+\.\d{2})/i,
              /TOTAL BALANCE[^\d\n]{0,40}?([\d,]+\.\d{2})/i,
              /ยอดรวมเงินที่เรียกเก็บ[^\d]{0,40}?([\d,]+\.\d{2})/,
              /สรุปยอดรอบนี้[^\d\n]{0,60}?([\d,]+\.\d{2})/,
              /TOTAL PAYMENT\/OVER PAID[^\d\n]{0,30}?([\d,]+\.\d{2})/i,
              /Outstanding Balance[^\d\n]{0,30}?([\d,]+\.\d{2})/i,
              /SUB TOTAL\s+([\d,]+\.\d{2})/i];
  for(const p of pats){const tm=text.match(p);if(tm){total=num(tm[1]);break;}}
  if(!total&&lines.length){
    // add up everything the bank charged this cycle, ignoring last month's payment
    const s=lines.filter(l=>!/payment|ชำระ|thank you|previous/i.test(l.desc))
                 .reduce((a,l)=>a+l.amt,0);
    if(s>0)total=Math.round(s*100)/100;
  }
  return{bank,lines,total};
}

/* read the closing + due date straight off the statement */
function allDates(text){
  const out=[];let m;
  const r1=/(\d{2})\/(\d{2})\/(\d{2,4})/g;
  while(m=r1.exec(text)){
    let y=+m[3];if(y<100)y+=2000;
    const d=new Date(y,+m[2]-1,+m[1]);
    if(d.getMonth()===+m[2]-1&&y>2015&&y<2100)out.push({i:m.index,d});
  }
  const r2=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/gi;
  while(m=r2.exec(text)){
    const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
    out.push({i:m.index,d:new Date(+m[3],mi,+m[1])});
  }
  return out.sort((a,b)=>a.i-b.i);
}
function nearest(dates,pos,filter){
  let best=null;
  dates.forEach(x=>{
    if(filter&&!filter(x.d))return;
    const dist=Math.abs(x.i-pos);
    if(dist>400)return;
    if(!best||dist<best.dist)best={dist,d:x.d};
  });
  return best&&best.d;
}
function readCycleDates(text){
  const dates=allDates(text);
  if(!dates.length)return null;
  const find=re=>{const m=text.match(re);return m?m.index:-1};
  const cp=find(/STATEMENT DATE|CLOSING DATE|วันสรุปยอดบัญชี/i);
  let closing=cp>=0?nearest(dates,cp):null;
  if(!closing){
    // fall back: the latest date that has another date 5-45 days after it
    for(const a of dates){
      if(dates.some(b=>{const g=(b.d-a.d)/864e5;return g>=5&&g<=45}))  {closing=a.d;break;}
    }
  }
  if(!closing)return null;
  let dp=find(/PAYMENT DUE DATE/i);
  if(dp<0)dp=find(/PAYMENT DATE|วันครบกำหนดชำระ|กำาหนดชำาระ/i);
  const after=d=>{const g=(d-closing)/864e5;return g>=5&&g<=45};
  let due=dp>=0?nearest(dates,dp,after):null;
  if(!due){const c=dates.filter(x=>after(x.d)).sort((a,b)=>a.d-b.d)[0];due=c&&c.d;}
  if(!due)return null;
  return{closing:iso(closing),due:iso(due)};
}

function findCashback(text){
  text=normDash(text);
  let cycle=null,year=null;
  const lines=[...text.matchAll(/CASH ?BACK REBATE[^\d\-]{0,20}-?\s*([\d,]+\.\d{2})/gi)].map(m=>num(m[1]));
  if(lines.length)cycle=lines.reduce((a,b)=>a+b,0);
  if(cycle==null){const m=text.match(/TMRW CASHBACK\s+([\d,]+\.\d{2})\s*CR/i);if(m)cycle=num(m[1]);}
  if(cycle==null){
    const m=text.match(/This Cycle Cash ?Back Received[^\d]{0,30}?([\d,]+\.\d{2})/i)
          ||text.match(/เครดิตเงินคืนรอบนี้[^\d]{0,40}?([\d,]+\.\d{2})/);
    if(m)cycle=num(m[1]);
  }
  const y=text.match(/This Year Cash ?Back Received[^\d]{0,30}?([\d,]+\.\d{2})/i)
        ||text.match(/เครดิตเงินคืนรวมปีนี้[^\d]{0,40}?([\d,]+\.\d{2})/);
  if(y)year=num(y[1]);
  return (cycle==null&&year==null)?null:{cycle:cycle||0,year};
}

/* matching */
function runMatch(cardId,parsed,closing){
  const c=card(cardId);
  // only consider purchases that could actually be on this bill
  const lo=closing?parse(closing)-50*864e5:null;
  const hi=closing?parse(closing).getTime():null;
  const inWindow=t=>{
    if(!closing)return true;
    const d=parse(t.date).getTime();
    return d<=hi&&d>=lo;
  };
  const pool=S.txns.filter(t=>t.cardId===cardId&&!t.actual&&inWindow(t));
  let matched=0;const queue=[];let reservedSum=0;
  parsed.lines.forEach(L=>{
    if(L.bank)return;
    if(L.seq&&L.of){
      const whole=L.amt*L.of;
      const p=S.plans.filter(p=>p.cardId===cardId).sort((a,b)=>
        Math.abs(a.total-whole)-Math.abs(b.total-whole))[0];
      if(p&&Math.abs(p.total-whole)/whole<0.15){
        p.paid=Math.max(p.paid,L.seq);p.monthly=L.amt;matched++;reservedSum+=up(L.amt,autoStep(L.amt));return;
      }
      queue.push(L);return;
    }
    const hit=pool.filter(t=>!t.actual&&t.reserved>=L.amt*0.97&&t.reserved<=L.amt*1.25)
      .sort((a,b)=>Math.abs(parse(a.date)-parse(L.date))-Math.abs(parse(b.date)-parse(L.date)))[0];
    if(hit){hit.actual=L.amt;matched++;reservedSum+=hit.reserved;}
    else queue.push(L);
  });
  return{matched,queue,reservedSum};
}

/* ---------------- pdf ---------------- */
async function openPdf(bytes,pw){
  const task=pdfjsLib.getDocument({data:bytes.slice(0),password:pw||undefined});
  const doc=await task.promise;
  let out='';
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{
      const y=it.transform[5],x=it.transform[4];
      if(!it.str||!it.str.trim())return;
      let r=rows.find(r=>Math.abs(r.y-y)<3);
      if(!r){r={y,items:[]};rows.push(r);}
      r.items.push({x,s:it.str});
    });
    rows.sort((a,b)=>b.y-a.y);
    rows.forEach(r=>{
      out+=r.items.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n';
    });
  }
  return out;
}
function pwCandidates(cardId){
  const out=[];
  if(S.pw&&S.pw[cardId])out.push(S.pw[cardId]);
  out.push('');
  Object.values(S.pw||{}).forEach(p=>out.push(p));
  const d=S.pwDate;
  if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){
    const[y,m,dd]=d.split('-'),M=MON[+m-1],yy=y.slice(2);
    out.push(dd+m+y, dd+m+yy, dd+M+yy, dd+M+y, dd+M.toUpperCase()+yy, dd+M.toUpperCase()+y,
             dd+M.toLowerCase()+yy, y+m+dd, m+dd+y, String(+dd)+String(+m)+y, dd+'-'+M+'-'+yy);
  }
  return [...new Set(out)];
}
function isPwError(e){
  return /password/i.test(String(e&&e.name)+' '+String(e&&e.message));
}
async function autoOpen(bytes,cardId){
  for(const p of pwCandidates(cardId)){
    try{
      const txt=await openPdf(bytes,p);
      if(p&&(!S.pw||S.pw[cardId]!==p)){S.pw=S.pw||{};S.pw[cardId]=p;await save();}
      return txt;
    }catch(e){
      if(isPwError(e))continue;
      throw e;
    }
  }
  return null;
}

async function doClose(snap){
  const b=V.b,c=card(b.cardId);
  const tot=b.total;
  const closing=b.closing||iso(closingFor(c,b.lines.length?b.lines[b.lines.length-1].date:today()));
  const key=c.id+'|'+closing;
  const cy=ensureCycle(key);
  if(b.due)cy.due=b.due;
  cy.total=tot;
  S.txns.filter(t=>t.cardId===c.id&&(!cycleOf(t)||cycleOf(t).status==='open')).forEach(t=>{
    if(parse(t.date)<=parse(closing))t.cyc=key;
  });
  const n=S.txns.filter(t=>t.cyc===key).length;
  if(b.paidAlready){
    cy.status='paid';cy.paidOn=today();
    S.txns.filter(t=>t.cyc===key).forEach(t=>t.moved=true);
    logAct({kind:'close',cardId:c.id,label:'Filed '+c.name+' · '+shortDate(closing)+' as paid',
      sub:n+' purchase'+(n===1?'':'s')+' filed',snap});
    toast('Filed away');
  }else{
    cy.status='billed';
    logAct({kind:'close',cardId:c.id,label:'Closed '+c.name+' · '+shortDate(closing),
      sub:n+' purchase'+(n===1?'':'s')+' filed',snap});
    toast('Cycle closed — it\'s on your home screen to pay');
  }
  await save();return go('home');
}
function keepNote(){
  const n=document.getElementById('note');if(n)V.note=n.value;
  const d=document.getElementById('dt');if(d)V.date=d.value;
}
async function commit(split){
  const c=card(V.cardId),amt=Number(V.amt);
  const date=V.date||today();
  const key=cycKey(c,date);ensureCycle(key);
  if(split){
    const monthly=+(amt/c.split).toFixed(2);
    const r=up(monthly,autoStep(monthly));
    S.plans.push({id:uid(),cardId:c.id,title:V.note||'—',total:amt,months:c.split,
      monthly,start:date,paid:0});
    S.txns.push({id:uid(),cardId:c.id,date,note:(V.note||'—'),actual:null,
      reserved:r,moved:false,cyc:key,planTitle:V.note});
    toast('แบ่ง '+c.split+'× · move '+B(r)+' this month');
  }else{
    const r=reserveFor(amt,V.rsv);
    S.txns.push({id:uid(),cardId:c.id,date,note:(V.note||'—'),actual:null,
      reserved:r,moved:false,cyc:key});
    toast('Saved · set aside '+B(r));
  }
  await save();go('home');
}
async function startReview(text){
  const parsed=parseStatement(text);
  if(!parsed.lines.length){toast('Couldn\'t read any lines — try pasting the text');return;}
  const c=card(V.b.cardId);
  const cd=readCycleDates(text);
  let fixed=null;
  if(cd){
    const nc=parse(cd.closing).getDate(),nd=parse(cd.due).getDate();
    if(c.cut!==nc||c.due!==nd){fixed=`ตัด ${nc}, due ${nd}`;c.cut=nc;c.due=nd;}
  }
  const r=runMatch(V.b.cardId,parsed,cd&&cd.closing);
  const cb=findCashback(text);
  V.b={...V.b,step:'review',lines:parsed.lines,queue:r.queue,i:0,
       matched:r.matched,reservedSum:r.reservedSum,total:parsed.total||'',added:0,flagged:0,
       closing:cd&&cd.closing,due:cd&&cd.due,fixed,cb,cbDone:false};
  await save();draw();
  if(fixed)toast('Dates picked up: '+fixed);
}
document.addEventListener('change',async e=>{

      const d=JSON.parse(await f.text());
      if(!d||!Array.isArray(d.txns))throw 0;
      S=d;
      if(!S.pw)S.pw={};
      S.cards=CARDS.map(x=>{const o=(S.cards||[]).find(y=>y.id===x.id)||{};
        return{...x,cut:o.cut??x.cut,due:o.due??x.due}});
      await save();toast('Restored '+S.txns.length+' purchases');return go('home');
    }catch(err){return toast('That doesn\'t look like a backup file');}
  }
  if(e.target.id==='pdf'){
    const f=e.target.files[0];if(!f)return;
    if(!V.b.cardId)return toast('Pick a card first');
    const bytes=new Uint8Array(await f.arrayBuffer());

      if(txt)return startReview(txt);

    }
  }
});

(async()=>{

    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  if(!S.cashback)S.cashback=[];

    S.jars=defaultJars();

    const carried=(S.jarOpen||0)+(S.moves||[]).reduce((a,m)=>a+(m.kind==='in'?m.amt:-m.amt),0);
    S.jars[0].open=carried;S.jarOpen=0;
    (S.moves||[]).forEach(m=>{if(!m.jar)m.jar=S.jars[0].id});
    S.needSplit=carried!==0;
  }
  const fixed=repairOpen();
  if(fixed)setTimeout(()=>toast('Cleaned up '+fixed+' mismatched purchase'+(fixed>1?'s':'')),600);
  if(!S.cards||!S.cards.length)S.cards=CARDS.map(c=>({...c}));
  else{
    CARDS.forEach(d=>{if(!S.cards.some(x=>x.id===d.id))S.cards.push({...d})});
    S.cards=S.cards.map(x=>{const d=CARDS.find(y=>y.id===x.id)||{};return{...d,...x}});
  }
  if(S.setup&&S.needSplit)V={view:'splitjars'};
  draw();
  // ask the phone not to bin our data when it tidies up
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  // then catch up with the online copy
  if(ghOn()){
    const r=await pullDown();
    if(r==='pulled'){toast('Brought down your latest');draw();}
    else if(r==='error'&&cfg().err==='key')toast('Sync key needs renewing');
  }
})();
/* coming back to the app after a while is a good moment to check */
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!ghOn())return;
  const c=cfg();
  if(c.last&&Date.now()-new Date(c.last).getTime()<60000)return;
  const r=await pullDown();
  if(r==='pulled'){toast('Brought down your latest');draw();}
});
</script>
